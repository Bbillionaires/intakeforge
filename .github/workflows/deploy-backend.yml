name: Deploy Backend

on:
  push:
    branches: [Azoth-made-1st]
    paths: [backend/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud builds submit --tag gcr.io/intakeforge-498216/intakeforge-backend ./backend

      - run: gcloud run deploy intakeforge-backend --image gcr.io/intakeforge-498216/intakeforge-backend --region us-central1 --platform managed --quiet
